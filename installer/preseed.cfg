
# UK locale, keyboard and timezone
d-i debian-installer/locale string en_GB.UTF-8
d-i keyboard-configuration/xkb-keymap select gb
d-i clock-setup/utc boolean true
d-i time/zone string Europe/London
d-i clock-setup/ntp boolean true

# Skip creation of a regular user
d-i passwd/make-user boolean false

# Keep the root account enabled
d-i passwd/root-login boolean true

# Minimal installation: no desktop or extra task groups
tasksel tasksel/first multiselect

# Encrypted LVM
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string crypt
d-i partman-auto/choose_recipe select uk-encrypted

# Allow LVM and disk changes
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Custom partition layout (sizes in MiB)
d-i partman-auto/expert_recipe string \
    uk-encrypted :: \
        500 500 500 ext4 \
            $primary{ } $bootable{ } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /boot } \
        . \
        10240 10240 10240 ext4 \
            $primary{ } $lvmok{ } lv_name{ root } \
            in_vg { crypt } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ / } \
        . \
        3072 3072 3072 ext4 \
            $primary{ } $lvmok{ } lv_name{ var } \
            in_vg { crypt } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /var } \
        . \
        4096 4096 4096 ext4 \
            $primary{ } $lvmok{ } lv_name{ varlog } \
            in_vg { crypt } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /var/log } \
        . \
        3072 3072 3072 ext4 \
            $primary{ } $lvmok{ } lv_name{ srv } \
            in_vg { crypt } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /srv } \
        . \
        2355 2355 2355 linux-swap \
            $primary{ } $lvmok{ } lv_name{ swap } \
            in_vg { crypt } \
            method{ swap } format{ } \
        . \
        5120 5120 -1 ext4 \
            $primary{ } $lvmok{ } lv_name{ home } \
            in_vg { crypt } \
            method{ format } format{ } \
            use_filesystem{ } filesystem{ ext4 } \
            mountpoint{ /home } \
        .

# Confirm partitioning
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

